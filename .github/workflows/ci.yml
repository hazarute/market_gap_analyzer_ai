name: halalinvest-ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Black check
        working-directory: backend
        run: black --check .

      - name: isort check
        working-directory: backend
        run: isort --check-only .

      - name: Bandit
        working-directory: backend
        run: bandit -r app

      - name: Safety
        working-directory: backend
        run: safety check -r requirements.txt

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          FMP_API_KEY: test-fmp-key
          ALPHA_VANTAGE_API_KEY: test-alpha-key
          FINNHUB_API_KEY: test-finnhub-key
          OPENROUTER_API_KEY: test-openrouter-key
          SECRET_KEY: test-secret-key-1234567890-test-secret-key
          ENVIRONMENT: development
          DEBUG: "true"
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  contract:
    name: Contract and OpenAPI Checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: OpenAPI and schema contract tests
        working-directory: backend
        run: pytest tests/unit/test_openapi_contract.py tests/unit/test_openapi_refactor.py tests/unit/test_schema_contracts.py

      - name: Alembic offline SQL check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/halal_db
        run: alembic upgrade head --sql > /tmp/alembic-upgrade.sql

  migration-smoke:
    name: Migration Smoke Test
    runs-on: ubuntu-latest
    needs: contract

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halal_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/halal_db
        run: python scripts/migration_smoke.py

      - name: Run migration smoke pytest contract
        working-directory: backend
        env:
          MIGRATION_SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/halal_db
        run: pytest tests/integration/test_migration_smoke.py -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: migration-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t halalinvest-backend:${{ github.sha }} ./backend
